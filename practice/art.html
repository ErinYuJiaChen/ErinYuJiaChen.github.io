<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Heart</title>
<style>
canvas{ 
	border: black 1px solid;
}
</style>
	</head>
	<body>
		<h1> Heart</h1>
		<canvas id="canvas" width="1000" height="1000">
		</canvas>
		<script>
			const canvas = document.getElementById("canvas");
			const ctx = canvas.getContext("2d");
			
			//right half
			ctx.fillStyle = "lightpink";
			ctx.strokeStyle = "pink";
			ctx.LineWidth=10;
			ctx.beginPath();
			ctx.ellipse(400, 600, 200, 50, -Math.PI/6, 0, 2*Math.PI);
			ctx.stroke();
			ctx.fill();
			//left half
			ctx.fillStyle = "lightpink";
			ctx.strokeStyle = "pink";
			ctx.LineWidth=10;
			ctx.beginPath();
			ctx.ellipse(350, 400, 200, 50, -5*Math.PI/6, 0, 2*Math.PI);
			ctx.stroke();
			ctx.fill();
		</script>
	</body>
</html>
