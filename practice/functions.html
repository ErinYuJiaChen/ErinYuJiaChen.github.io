<!DOCTYPE html>
<html lang="en">
	<head>
		<title></title>
	</head>
	<body>
		<p></p>
		<script>
			//this is a function built into javascript
			//i think of this as a function rovot
			//it takes input but does not give output
			//instead, it goes and interacts with the world
			console.log("test);
			//function
			function sayHi(){
				console.log("hi");
			}
			//now call or execute the fuction

			sayHi();
			sayHi();

			//function with inputs
			function sayHiToSomeone(who){
				console.log("hi" +who);
				}
			sayHiToSomeone("Boo");
			sayHiToSomeone("huhhh");

			//functions can have lots of inputs
			//in math, you can say g(a, b)
			function sayHiToTwoPeople(who1, who2){
				console.log("hi " + who1 + "and" + who2);
			}
			sayHiToTwoPeople("Boo", "hi");


		</script>
	</body>
