<!DOCTYPE html>
<html lang="en">
	<head>
		<title>parade</title>
<style>
canvas{
	border: 1px Black solid;
}
</style>
	</head>
	<body>
		<h1>Parade</h1>
		<canvas id="myCanvas"
			width="800"
			height="800">
		</canvas>
			<script>
const canvas = document
.getElementById("myCanvas");
const ctx = canvas.getContext("2d");
let x = 1;
let x2 = 1;
let x3 = 1;
let x4 = 1;
let speed=1
let speed2=2
let speed3=3
let speed4=4
let time=0;
function animate(){
time=time+1;
	x = x + speed;
	x2 = x2 + speed2;
	x3 = x3 + speed3;
	x4 = x4 + speed4;

//circle
ctx.fillStyle = "pink";
ctx.beginPath();
ctx.arc(x4,300,20,0, 2*Math.PI);
ctx.stroke();
ctx.fill();

//circle
ctx.fillStyle = "HotPink";
ctx.beginPath();
ctx.arc(x3,300,20,0, 2*Math.PI);
ctx.stroke();
ctx.fill();

//circle
ctx.fillStyle = "IndianRed";
ctx.beginPath();
ctx.arc(x2,300,20,0, 2*Math.PI);
ctx.stroke();
ctx.fill();

//circle
ctx.fillStyle = "LightCoral";
ctx.beginPath();
ctx.arc(x4,300,20,0, 2*Math.PI);
ctx.stroke();
ctx.fill();




requestAnimationFrame(animate);
}
	animate();

			</script>
	</body>
</html>
